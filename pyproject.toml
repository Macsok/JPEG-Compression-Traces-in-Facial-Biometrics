[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpeg-compression-detection-research"
version = "0.1.0"
description = "Research code for JPEG compression detection and quality estimation"
readme = "README.md"
requires-python = ">=3.10.11,<3.11"
dependencies = [
    "numpy==1.26.3",
    "opencv-python==4.10.0.84",
]

[project.optional-dependencies]
research = [
    "imageio==2.36.0",
    "ipykernel==5.5.6",
    "ipython==7.34.0",
    "joblib==1.2.0",
    "matplotlib==3.7.1",
    "nbconvert==7.16.4",
    "nbformat==5.10.4",
    "notebook==6.5.5",
    "pandas==2.2.2",
    "Pillow==11.0.0",
    "pygame==2.5.2",
    "rawpy==0.25.1",
    "requests==2.32.3",
    "scikit-learn==1.3.2",
    "scipy==1.10.1",
    "seaborn==0.12.2",
    "tqdm==4.65.0",
]
test = [
    "ipython==7.34.0",
    "pytest==6.2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
